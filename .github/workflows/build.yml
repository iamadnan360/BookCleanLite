name: Build BookClean Lite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir project
          unzip -q BookCleanLite.zip -d project
          find project -maxdepth 3 -type f | head -50

      - name: Build APK
        working-directory: project/BookCleanLite
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BookClean-Lite
          path: project/BookCleanLite/app/build/outputs/apk/release/app-release.apk
